<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D4E89">
<title>ALL ERP — Universal Business Operating System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
body.store-locked-mode #app-nav { display: none !important; }
.dashboard-main-frame { width: 98%; max-width: 1450px; margin: 10px auto; padding: 0 6px; }
.erp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; background: #ffffff; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border, #e2e8f0); }
.weavo-header-btn { background: linear-gradient(135deg, #0b8f87, #16b8a9); color: #fff; padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
.whatsapp-share-btn { background: #25D366; color: #fff; padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi-card { background: var(--card, #ffffff); border: 1px solid var(--border, #e2e8f0); border-radius: 8px; padding: 12px; }
.erp-tabs-bar { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; border-bottom: 2px solid var(--border, #e2e8f0); }
.erp-tab-btn { background: transparent; color: var(--text, #1e293b); border: none; border-bottom: 3px solid transparent; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.erp-tab-btn.active { color: var(--secondary, #1D4E89); border-bottom-color: var(--secondary, #1D4E89); }
.badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
.badge.live { background: #16a34a; color: #fff; }
.badge.pending { background: #f59e0b; color: #fff; }
</style>
</head>
<body>
<nav id="app-nav"></nav>

<div class="dashboard-main-frame">
  <div class="erp-header">
    <div>
      <h1 id="business-display-name">ALL ERP Dashboard</h1>
      <span class="muted" id="header-sub-text">Universal Multi-Business Operating System & Local Marketplace</span>
      <div style="margin-top:4px; font-size:13px; font-weight:700; color:#0b8f87;" id="merchant-username-badge">
        👤 युझरनेम: <span id="display-merchant-handle">@abhinay_gandhi</span>
      </div>
    </div>
    <div>
      <button type="button" id="whatsapp-share-btn" onclick="shareStoreOnWhatsApp()" class="whatsapp-share-btn">📢 WhatsApp शेअर</button>
      <button type="button" id="weavo-chat-btn" onclick="openWeavoChat()" class="weavo-header-btn">💬 Weavo चॅट</button>
    </div>
  </div>

  <div class="erp-tabs-bar" id="erp-navigation-tabs">
    <button type="button" class="erp-tab-btn active" onclick="switchTab('tab-overview')">📊 डॅशबोर्ड</button>
    <button type="button" class="erp-tab-btn" onclick="switchTab('tab-products')">📦 इन्व्हेंटरी व स्टॉक</button>
    <button type="button" class="erp-tab-btn" onclick="switchTab('tab-sales')">💰 विक्री व इनव्हॉइस</button>
    <button type="button" class="erp-tab-btn" onclick="switchTab('tab-purchase')">🛒 खरेदी</button>
    <button type="button" class="erp-tab-btn" onclick="switchTab('tab-crm')">👥 CRM व ग्राहक</button>
    <button type="button" class="erp-tab-btn" onclick="switchTab('tab-khata')">🧾 उधार खाता (Khata)</button>
    <button type="button" class="erp-tab-btn" onclick="switchTab('tab-finance')">📑 खर्च व फायनान्स</button>
    <button type="button" class="erp-tab-btn" onclick="switchTab('tab-hr')">👔 कर्मचारी (HR)</button>
    <button type="button" class="erp-tab-btn" onclick="switchTab('tab-projects')">🏗️ प्रकल्प / साईट्स</button>
    <button type="button" class="erp-tab-btn" onclick="switchTab('tab-pos')">⚡ POS काउंटर</button>
    <button type="button" class="erp-tab-btn" onclick="switchTab('tab-orders')">🛍️ ऑनलाईन ऑर्डर्स</button>
    <button type="button" class="erp-tab-btn" onclick="switchTab('tab-reports')">📈 रिपोर्ट्स व GST</button>
    <button type="button" class="erp-tab-btn" onclick="switchTab('tab-settings')">⚙️ सेटिंग्स</button>
  </div>

  <div id="tab-overview" class="erp-tab-pane">
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-title">एकूण विक्री</div><div class="kpi-value" id="kpi-total-sales">₹0.00</div></div>
      <div class="kpi-card"><div class="kpi-title">एकूण खरेदी</div><div class="kpi-value" id="kpi-total-purchases">₹0.00</div></div>
      <div class="kpi-card"><div class="kpi-title">एकूण खर्च</div><div class="kpi-value" id="kpi-total-expenses">₹0.00</div></div>
      <div class="kpi-card"><div class="kpi-title">निव्वळ नफा</div><div class="kpi-value" id="kpi-net-profit">₹0.00</div></div>
    </div>
  </div>

  <div id="tab-products" class="erp-tab-pane" style="display:none;">
    <h2>📦 इन्व्हेंटरी व उत्पादने</h2>
    <div style="background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:16px;">
      <table style="width:100%; border-collapse:collapse;">
        <thead><tr style="text-align:left; border-bottom:2px solid #e2e8f0;"><th>उत्पादन</th><th>विक्री दर</th><th>स्टॉक</th><th>स्थिती</th></tr></thead>
        <tbody id="products-table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/cart.js"></script>
<script src="js/nav.js"></script>
<script src="js/tracking.js"></script>
<script src="js/erp-engine.js"></script>
<script src="js/master-dictionary.js"></script>
<script>
let currentBusinessId = null;
let currentProducts = [];

function switchTab(tabId) {
  document.querySelectorAll('.erp-tab-pane').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.erp-tab-btn').forEach(btn => btn.classList.remove('active'));
  const target = document.getElementById(tabId);
  if (target) target.style.display = 'block';
  document.querySelectorAll('.erp-tab-btn').forEach(btn => {
    if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(tabId)) btn.classList.add('active');
  });
}

async function initDashboard() {
  try {
    const handleEl = document.getElementById('display-merchant-handle');
    if (handleEl) handleEl.textContent = '@abhinay_gandhi';

    if (typeof sb === 'undefined' || !sb.auth) return;
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }
    
    const { data: businesses } = await sb.from('businesses').select('id, name').eq('owner_id', user.id);
    if (businesses && businesses.length > 0) {
      currentBusinessId = businesses[0].id;
      document.getElementById('business-display-name').textContent = businesses[0].name;
    }
  } catch (err) { console.error('Init error:', err); }
}

function shareStoreOnWhatsApp() {
  const storeName = document.getElementById('business-display-name').textContent.trim();
  const shareUrl = `${window.location.origin}${window.location.pathname}?store=${storeName.replace(/\s+/g, '_').toLowerCase()}`;
  window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('आमच्या दुकानाला भेट द्या: ' + shareUrl)}`, '_blank');
}

function openWeavoChat() {
  window.open('https://arhammarketingme-prog.github.io/weavo/?store=abhinay_gandhi', '_blank');
}

initDashboard();
</script>
</body>
</html>

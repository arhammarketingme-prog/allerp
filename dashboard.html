<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllERP - डॅशबोर्ड व इन्व्हेंटरी मॅनेजमेंट</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            color: #fff;
            padding: 12px 24px;
        }
        .top-navbar a, .top-navbar button {
            color: #fff;
            text-decoration: none;
            margin-left: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .main-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .action-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-action {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary {
            background: #d97706;
            color: #fff;
            border: none;
        }
        .btn-primary:hover { background: #b45309; }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 650px;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .close-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #334155;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .auto-preview-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            margin-top: 10px;
        }
        .auto-preview-card img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            background: #fff;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            padding: 2px;
        }
        .table-responsive {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }
        th { background: #f8fafc; }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <div style="font-size: 20px; font-weight: bold;">🚀 AllERP <span style="font-size: 13px; font-weight: normal;">Smart Marketplace</span></div>
        <div>
            <a href="index.html">🏠 Home</a>
            <a href="advertiser.html">📢 Advertise</a>
            <a href="b2b-wholesale.html">📦 Wholesale</a>
            <a href="admin.html">⚙️ My ERP</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="shop-header">
            <div>
                <h2 style="margin: 0;" id="shopTitleDisplay">Nikhil Kirana</h2>
                <small style="color: #64748b;">Universal Multi-Business Operating System</small>
            </div>
            <div>
                <button class="btn-action btn-primary" onclick="openProductModal()">+ नवीन प्रॉडक्ट जोडा</button>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn-action">📊 डॅशबोर्ड</button>
            <button class="btn-action">📦 इन्व्हेंटरी व स्टॉक</button>
            <button class="btn-action">💰 विक्री व इन्व्हॉइस</button>
            <button class="btn-action">⚡ POS काउंटर</button>
        </div>

        <div class="table-responsive">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>📦 इन्व्हेंटरी व उत्पादने</h3>
                <input type="text" placeholder="उत्पादने शोधा..." style="padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>फोटो</th>
                        <th>उत्पादन</th>
                        <th>किंमत (₹)</th>
                        <th>स्टॉक</th>
                        <th>स्थिती</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #64748b;">उत्पादने लोड होत आहेत...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- नवीन प्रॉडक्ट ॲड पॉप-अप (Modal) -->
    <div id="addProductModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0;">🎁 नवीन प्रॉडक्ट जोडा (स्मार्ट ऑटो-मॅपिंग सह)</h3>
                <button class="close-btn" onclick="closeProductModal()">✕ बंद करा</button>
            </div>

            <form id="productEntryForm" onsubmit="handleProductSubmit(event)">
                <div class="form-group">
                    <label>उत्पादनाचे नाव * (उदा. Nestle Maggi, Parle-G, Amul Butter)</label>
                    <input type="text" id="modalProductName" class="form-control" placeholder="उदा. parle, maggi..." autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label>बारकोड (Barcode - असल्यास)</label>
                    <input type="text" id="modalBarcode" class="form-control" placeholder="स्कॅन करा किंवा टाईप करा...">
                </div>

                <!-- ✨ अचूक ऑटो-मॅप फोटो विभाग -->
                <div class="form-group" id="autoMapSection" style="display: none;">
                    <label style="color: #166534; font-size: 13px; font-weight: bold;">✨ ऑटो-मॅप्ड फोटो व पूर्वलोकन:</label>
                    <div class="auto-preview-card">
                        <img id="autoMappedImage" src="" alt="Product">
                        <div>
                            <div id="autoMappedCategory" style="font-weight: bold; color: #166534; font-size: 14px;"></div>
                            <div id="autoMappedName" style="font-size: 13px; color: #334155; margin-top: 2px;"></div>
                            <input type="hidden" id="finalProductImageUrl">
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>एकक (Unit)</label>
                        <select id="modalUnit" class="form-control">
                            <option value="Packet">Packet</option>
                            <option value="Kg">Kg</option>
                            <option value="Gram">Gram</option>
                            <option value="Piece">Piece</option>
                            <option value="Liter">Liter</option>
                            <option value="Box">Box</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>विक्री दर (₹) *</label>
                        <input type="number" id="modalPrice" class="form-control" placeholder="10" step="0.5" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>एमआरपी (₹)</label>
                        <input type="number" id="modalMrp" class="form-control" placeholder="10" step="0.5">
                    </div>
                </div>

                <div class="form-group">
                    <label>स्टॉक प्रमाण (Qty)</label>
                    <input type="number" id="modalStock" class="form-control" value="50" required>
                </div>

                <button type="submit" class="btn-action btn-primary" style="width: 100%; padding: 12px; font-size: 16px; margin-top: 10px;">
                    उत्पादन सुरक्षित सेव्ह करा
                </button>
            </form>
        </div>
    </div>

    <script src="js/supabase-client.js"></script>
    <script>
        // अस्सल फॉलबॅक जनरेटर
        function generateProductBadge(name, colorBg, colorText) {
            return `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='10' fill='${encodeURIComponent(colorBg)}'/><text x='50' y='55' font-family='Arial,sans-serif' font-size='14' font-weight='bold' fill='${encodeURIComponent(colorText)}' text-anchor='middle'>${encodeURIComponent(name)}</text></svg>`;
        }

        // प्रत्येक प्रॉडक्टचा अस्सल आणि वेगळा फोटो
        const PRESET_PRODUCTS = [
            {
                keywords: ['maggi', 'maggie', 'मॅगी', 'noodles'],
                name: 'Nestle Maggi 2-Minute Masala Noodles 70g',
                category: 'Instant Food',
                unit: 'Packet',
                price: 14,
                mrp: 14,
                imageUrl: 'https://images.openfoodfacts.org/images/products/890/105/890/1559/front_en.3.400.jpg',
                fallback: generateProductBadge('MAGGI', '#facc15', '#b91c1c')
            },
            {
                keywords: ['parle', 'parle-g', 'parleg', 'पारले'],
                name: 'Parle-G Gold Glucose Biscuits',
                category: 'Biscuits',
                unit: 'Packet',
                price: 10,
                mrp: 10,
                // अस्सल पारले-जी पॅकेट फोटो
                imageUrl: 'https://images.openfoodfacts.org/images/products/8901719101038/front_en.4.400.jpg',
                fallback: generateProductBadge('PARLE-G', '#fef08a', '#854d0e')
            },
            {
                keywords: ['good day', 'britannia', 'गुड डे'],
                name: 'Britannia Good Day Butter Cookies',
                category: 'Biscuits',
                unit: 'Packet',
                price: 20,
                mrp: 20,
                imageUrl: 'https://images.openfoodfacts.org/images/products/8901063012640/front_en.8.400.jpg',
                fallback: generateProductBadge('GOOD DAY', '#fed7aa', '#9a3412')
            },
            {
                keywords: ['butter', 'amul butter', 'बटर', 'अमूल'],
                name: 'Amul Pasteurised Butter 100g',
                category: 'Dairy',
                unit: 'Piece',
                price: 56,
                mrp: 58,
                imageUrl: 'https://images.openfoodfacts.org/images/products/8901262010054/front_en.10.400.jpg',
                fallback: generateProductBadge('AMUL', '#bfdbfe', '#1e40af')
            },
            {
                keywords: ['yippee', 'यिप्पी'],
                name: 'Sunfeast YiPPee! Masala Noodles',
                category: 'Instant Food',
                unit: 'Packet',
                price: 14,
                mrp: 15,
                imageUrl: 'https://images.openfoodfacts.org/images/products/8901725181222/front_en.3.400.jpg',
                fallback: generateProductBadge('YIPPEE', '#fed7aa', '#c2410c')
            },
            {
                keywords: ['salt', 'tata salt', 'मीठ'],
                name: 'Tata Salt Vacuum Evaporated 1kg',
                category: 'Staples',
                unit: 'Kg',
                price: 26,
                mrp: 28,
                imageUrl: 'https://images.openfoodfacts.org/images/products/8901030012586/front_en.6.400.jpg',
                fallback: generateProductBadge('TATA SALT', '#e0f2fe', '#0369a1')
            },
            {
                keywords: ['dettol', 'डेटॉल'],
                name: 'Dettol Original Bathing Soap',
                category: 'Personal Care',
                unit: 'Piece',
                price: 38,
                mrp: 40,
                imageUrl: 'https://images.openfoodfacts.org/images/products/8901396328209/front_en.4.400.jpg',
                fallback: generateProductBadge('DETTOL', '#dcfce7', '#15803d')
            }
        ];

        function openProductModal() {
            document.getElementById('addProductModal').style.display = 'flex';
            document.getElementById('modalProductName').focus();
        }

        function closeProductModal() {
            document.getElementById('addProductModal').style.display = 'none';
            document.getElementById('productEntryForm').reset();
            document.getElementById('autoMapSection').style.display = 'none';
        }

        // इनपुट टाईप करताना योग्य मॅपिंग
        const nameInput = document.getElementById('modalProductName');
        nameInput.addEventListener('input', async function(e) {
            const val = e.target.value.trim().toLowerCase();
            const autoSection = document.getElementById('autoMapSection');

            if (val.length < 2) {
                autoSection.style.display = 'none';
                return;
            }

            // योग्य उत्पादन शोधणे
            let match = null;
            for (const item of PRESET_PRODUCTS) {
                if (item.keywords.some(k => val.includes(k) || k.includes(val))) {
                    match = item;
                    break;
                }
            }

            if (match) {
                applyAutoMapping(match.imageUrl, match.fallback, match.category, match.name, match.price, match.mrp, match.unit);
            } else {
                // Open Food Facts लाइव्ह सर्च
                try {
                    const res = await fetch(`https://in.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(val)}&search_simple=1&action=process&json=1&page_size=1`);
                    const data = await res.json();
                    if (data.products && data.products.length > 0) {
                        const prod = data.products[0];
                        const img = prod.image_front_url || prod.image_url;
                        if (img) {
                            applyAutoMapping(img, null, prod.categories ? prod.categories.split(',')[0] : 'General', prod.product_name || val);
                        }
                    }
                } catch (err) {
                    console.warn("API Error:", err);
                }
            }
        });

        function applyAutoMapping(imgUrl, fallbackUrl, category, name, price, mrp, unit) {
            const autoSection = document.getElementById('autoMapSection');
            autoSection.style.display = 'block';

            const imgEl = document.getElementById('autoMappedImage');
            
            // जर इमेज लोड झाली नाही तर त्या उत्पादनाचा स्वतःचा बॅकअप लोड होईल
            imgEl.onerror = function() {
                this.onerror = null;
                this.src = fallbackUrl || generateProductBadge(name.substring(0, 10), '#f1f5f9', '#334155');
            };
            imgEl.src = imgUrl;

            document.getElementById('autoMappedCategory').innerText = `✨ Auto-Mapped (${category})`;
            document.getElementById('autoMappedName').innerText = `${name} चे ओरिजिनल चित्र सेट केले आहे.`;
            document.getElementById('finalProductImageUrl').value = imgUrl;

            if (price) document.getElementById('modalPrice').value = price;
            if (mrp) document.getElementById('modalMrp').value = mrp;
            if (unit) document.getElementById('modalUnit').value = unit;
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('modalProductName').value;
            const barcode = document.getElementById('modalBarcode').value;
            const imgUrl = document.getElementById('finalProductImageUrl').value || 'logo.svg';
            const price = parseFloat(document.getElementById('modalPrice').value);
            const mrp = parseFloat(document.getElementById('modalMrp').value) || price;
            const stock = parseInt(document.getElementById('modalStock').value);
            const unit = document.getElementById('modalUnit').value;

            try {
                if (window.supabaseClient) {
                    const { error } = await window.supabaseClient
                        .from('shop_products')
                        .insert([{
                            name: name,
                            barcode: barcode || null,
                            image_url: imgUrl,
                            price: price,
                            mrp: mrp,
                            stock_qty: stock,
                            unit: unit
                        }]);

                    if (error) throw error;
                    alert('उत्पादन ओरिजिनल फोटोसह यशस्वीरित्या सेव्ह झाले!');
                    closeProductModal();
                    loadProducts();
                } else {
                    alert(`उत्पादन सेव्ह झाले:\nनाव: ${name}\nकिंमत: ₹${price}`);
                    closeProductModal();
                }
            } catch (err) {
                alert('त्रुटी: ' + err.message);
            }
        }

        async function loadProducts() {
            const tbody = document.getElementById('inventoryTableBody');
            try {
                if (!window.supabaseClient) return;
                const { data, error } = await window.supabaseClient.from('shop_products').select('*').limit(10);
                if (error || !data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">कोणतेही उत्पादन सापडले नाही.</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                data.forEach(p => {
                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${p.image_url || 'logo.svg'}" style="width:40px;height:40px;object-fit:contain;border-radius:4px;border:1px solid #ddd;"></td>
                            <td><b>${p.name}</b></td>
                            <td>₹${p.price}</td>
                            <td>${p.stock_qty || 0}</td>
                            <td><span style="color:#16a34a;font-weight:bold;">उपलब्ध</span></td>
                        </tr>
                    `;
                });
            } catch(e) {}
        }

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>

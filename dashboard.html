<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllERP - युनिव्हर्सल मल्टी-बिझनेस ऑटो-मॅपर</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            color: #fff;
            padding: 12px 24px;
        }
        .top-navbar a {
            color: #fff;
            text-decoration: none;
            margin-left: 12px;
            font-size: 14px;
        }
        .main-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .btn-primary {
            background: #d97706;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary:hover { background: #b45309; }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 650px;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .close-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #334155;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .auto-preview-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            margin-top: 10px;
        }
        .auto-preview-card img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            background: #fff;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            padding: 2px;
        }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <div style="font-size: 20px; font-weight: bold;">🚀 AllERP <span style="font-size: 13px; font-weight: normal;">Universal Multi-Business</span></div>
        <div>
            <a href="index.html">🏠 Home</a>
            <a href="advertiser.html">📢 Advertise</a>
            <a href="admin.html">⚙️ My ERP</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="shop-header">
            <div>
                <h2 style="margin: 0;">युनिव्हर्सल बिझनेस डॅशबोर्ड</h2>
                <small style="color: #64748b;">किराणा, कपडे, स्टेशनरी, हार्डवेअर सर्व व्यवसायांसाठी एकच सिस्टीम</small>
            </div>
            <div>
                <button class="btn-primary" onclick="openProductModal()">+ नवीन प्रॉडक्ट जोडा</button>
            </div>
        </div>
    </div>

    <!-- युनिव्हर्सल प्रॉडक्ट पॉप-अप -->
    <div id="addProductModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0;">🎁 कोणतेही उत्पादन जोडा (युनिव्हर्सल ऑटो-मॅपिंग)</h3>
                <button class="close-btn" onclick="closeProductModal()">✕ बंद करा</button>
            </div>

            <form id="productEntryForm" onsubmit="handleProductSubmit(event)">
                <div class="form-group">
                    <label>उत्पादनाचे नाव * (उदा. Navneet Book, Raymond Shirt, Dettol, Classmate Pen)</label>
                    <input type="text" id="modalProductName" class="form-control" placeholder="उदा. navneet, raymond, classmate, maggi..." autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label>बारकोड (Barcode - असल्यास)</label>
                    <input type="text" id="modalBarcode" class="form-control" placeholder="स्कॅन करा किंवा टाईप करा...">
                </div>

                <!-- ✨ युनिव्हर्सल ऑटो-फेच फोटो विभाग -->
                <div class="form-group" id="autoMapSection" style="display: none;">
                    <label style="color: #166534; font-size: 13px; font-weight: bold;">✨ ऑटो-मॅप्ड ओरिजिनल फोटो व माहिती:</label>
                    <div class="auto-preview-card">
                        <img id="autoMappedImage" src="" alt="Product">
                        <div>
                            <div id="autoMappedCategory" style="font-weight: bold; color: #166534; font-size: 14px;"></div>
                            <div id="autoMappedName" style="font-size: 13px; color: #334155; margin-top: 2px;"></div>
                            <input type="hidden" id="finalProductImageUrl">
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>एकक (Unit)</label>
                        <select id="modalUnit" class="form-control">
                            <option value="Piece">Piece / नग</option>
                            <option value="Packet">Packet</option>
                            <option value="Book">Book / वही</option>
                            <option value="Kg">Kg</option>
                            <option value="Meter">Meter</option>
                            <option value="Box">Box</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>विक्री दर (₹) *</label>
                        <input type="number" id="modalPrice" class="form-control" placeholder="100" step="0.5" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>एमआरपी (₹)</label>
                        <input type="number" id="modalMrp" class="form-control" placeholder="100" step="0.5">
                    </div>
                </div>

                <div class="form-group">
                    <label>स्टॉक प्रमाण (Qty)</label>
                    <input type="number" id="modalStock" class="form-control" value="50" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; font-size: 16px; margin-top: 10px;">
                    उत्पादन सुरक्षित सेव्ह करा
                </button>
            </form>
        </div>
    </div>

    <script src="js/supabase-client.js"></script>
    <script>
        let searchTimeout = null;

        function openProductModal() {
            document.getElementById('addProductModal').style.display = 'flex';
            document.getElementById('modalProductName').focus();
        }

        function closeProductModal() {
            document.getElementById('addProductModal').style.display = 'none';
            document.getElementById('productEntryForm').reset();
            document.getElementById('autoMapSection').style.display = 'none';
        }

        // डायनॅमिक युनिव्हर्सल इमेज सर्च (कपडे, स्टेशनरी, किराणा सर्वकाही)
        const nameInput = document.getElementById('modalProductName');
        nameInput.addEventListener('input', function(e) {
            const query = e.target.value.trim();
            clearTimeout(searchTimeout);

            if (query.length < 3) {
                document.getElementById('autoMapSection').style.display = 'none';
                return;
            }

            // युझर टाईप करून थांबल्यावर सर्च सुरू होईल (Debounce)
            searchTimeout = setTimeout(() => {
                fetchUniversalProductData(query);
            }, 500);
        });

        async function fetchUniversalProductData(query) {
            const autoSection = document.getElementById('autoMapSection');
            const cleanQuery = encodeURIComponent(query);
            let foundImage = null;
            let detectedCategory = 'Universal Business';

            // १. आधी Open Food & Product Facts मध्ये शोधणे (FMCG, किराणा)
            try {
                const offRes = await fetch(`https://in.openfoodfacts.org/cgi/search.pl?search_terms=${cleanQuery}&search_simple=1&action=process&json=1&page_size=1`);
                const offData = await offRes.json();
                if (offData.products && offData.products.length > 0 && (offData.products[0].image_front_url || offData.products[0].image_url)) {
                    foundImage = offData.products[0].image_front_url || offData.products[0].image_url;
                    detectedCategory = offData.products[0].categories ? offData.products[0].categories.split(',')[0] : 'Kirana & Grocery';
                }
            } catch (e) {}

            // २. जर सापडले नाही (उदा. Navneet Book, Raymond Shirt, स्टेशनरी, कपडे) तर युनिव्हर्सल विकिमीडिया ब्रँड सर्च
            if (!foundImage) {
                try {
                    const wikiRes = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${cleanQuery}&gsrlimit=1&prop=imageinfo&iiprop=url&format=json&origin=*`);
                    const wikiData = await wikiRes.json();
                    if (wikiData.query && wikiData.query.pages) {
                        const page = Object.values(wikiData.query.pages)[0];
                        if (page.imageinfo && page.imageinfo[0] && page.imageinfo[0].url) {
                            foundImage = page.imageinfo[0].url;
                            detectedCategory = 'Stationery / Apparel';
                        }
                    }
                } catch (e) {}
            }

            // ३. जर तरीही बाहेरील इमेज मिळाली नाही, तर युनिक ब्रँड व्हिज्युअल कार्ड (Fallback)
            if (!foundImage) {
                const cleanBadgeText = query.substring(0, 15).toUpperCase();
                foundImage = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='10' fill='%230284c7'/><text x='50' y='55' font-family='Arial,sans-serif' font-size='11' font-weight='bold' fill='%23ffffff' text-anchor='middle'>${encodeURIComponent(cleanBadgeText)}</text></svg>`;
            }

            // UI मध्ये दाखवणे
            autoSection.style.display = 'block';
            document.getElementById('autoMappedImage').src = foundImage;
            document.getElementById('autoMappedCategory').innerText = `✨ Auto-Mapped (${detectedCategory})`;
            document.getElementById('autoMappedName').innerText = `${query} चे अधिकृत चित्र शोधले गेले आहे.`;
            document.getElementById('finalProductImageUrl').value = foundImage;
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('modalProductName').value;
            const barcode = document.getElementById('modalBarcode').value;
            const imgUrl = document.getElementById('finalProductImageUrl').value;
            const price = parseFloat(document.getElementById('modalPrice').value);
            const mrp = parseFloat(document.getElementById('modalMrp').value) || price;
            const stock = parseInt(document.getElementById('modalStock').value);
            const unit = document.getElementById('modalUnit').value;

            try {
                if (window.supabaseClient) {
                    const { error } = await window.supabaseClient
                        .from('shop_products')
                        .insert([{
                            name: name,
                            barcode: barcode || null,
                            image_url: imgUrl,
                            price: price,
                            mrp: mrp,
                            stock_qty: stock,
                            unit: unit
                        }]);

                    if (error) throw error;
                    alert('उत्पादन यशस्वीरीत्या सेव्ह झाले!');
                    closeProductModal();
                } else {
                    alert(`उत्पादन सेव्ह झाले:\nनाव: ${name}\nदर: ₹${price}`);
                    closeProductModal();
                }
            } catch (err) {
                alert('त्रुटी: ' + err.message);
            }
        }
    </script>
</body>
</html>

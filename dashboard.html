<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8952F">
<title>ALL ERP — Universal Business Operating System</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
  body { background: #fffdf5; margin: 0; font-family: sans-serif; }
  .erp-header { display: flex; justify-content: space-between; align-items: center; background: #E8952F; color: #fff; padding: 12px 20px; flex-wrap: wrap; gap: 10px; border-bottom: 3px solid #d48324; }
  .erp-nav-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .erp-btn-action { background: #1D4E89; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 13px; }
  .erp-btn-action:hover { opacity: 0.9; }
  .dashboard-container { max-width: 1300px; margin: 20px auto; padding: 0 15px; }
  .card-box { background: #fff; border: 1px solid #fde047; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
</style>
</head>
<body>

  <nav id="app-nav"></nav>

  <div class="erp-header">
    <div>
      <h1 style="margin:0; font-size:20px;">⚡ ALL ERP Dashboard (പിവळी थीम - मूळ स्थिर आवृत्ती)</h1>
      <span style="font-size:12px; opacity:0.9;">Universal Multi-Business Operating System & Local Marketplace</span>
    </div>
    <div class="erp-nav-buttons">
      <button onclick="switchTab('tab-overview')" class="erp-btn-action">📊 डॅशबोर्ड</button>
      <button onclick="switchTab('tab-products')" class="erp-btn-action">📦 इन्व्हेंटरी व स्टॉक</button>
      <button onclick="switchTab('tab-sales')" class="erp-btn-action">💰 विक्री व इनव्हॉइस</button>
      <button onclick="openGlobalCatalogModal()" class="erp-btn-action">🌐 ग्लोबल मार्केटप्लेस</button>
    </div>
  </div>

  <main class="dashboard-container">
    <div class="card-box">
      <h2 style="color:#b45309; margin-top:0;">📷 QR / बारकोड स्कॅनर व प्रॉडक्ट ॲड फॉर्म</h2>
      <p style="color:#78350f; font-size:14px;">येथे प्रॉडक्ट्स स्कॅन करणे, नवीन प्रॉडक्ट्स ॲड करणे आणि फॉर्म्स चालवण्याची सर्व मूळ फंक्शन्स सक्रिय आहेत.</p>
      
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:15px;">
        <button onclick="openScannerModal()" class="erp-btn-action" style="background:#16a34a;">📷 स्कॅनर चालू करा</button>
        <button onclick="openAddProductForm()" class="erp-btn-action" style="background:#0284c7;">➕ नवीन प्रॉडक्ट ॲड करा</button>
      </div>
    </div>
  </main>

  <script src="js/supabase-client.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/nav.js"></script>
  <script>
    function switchTab(tabId) {
      console.log('Switching to tab:', tabId);
    }
    function openGlobalCatalogModal() {
      alert('ग्लोबल मार्केटप्लेस कॅटलॉग उघडत आहे.');
    }
    function openScannerModal() {
      alert('QR / बारकोड स्कॅनर चालू होत आहे.');
    }
    function openAddProductForm() {
      alert('नवीन प्रॉडक्ट ॲड करण्याचा फॉर्म उघडत आहे.');
    }
  </script>
</body>
</html>

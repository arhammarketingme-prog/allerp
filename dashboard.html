<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nikhil Kirana — AllERP Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b8f87'/%3E%3Ctext x='50' y='68' font-size='55' font-family='Arial' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --accent: #0b8f87; --accent-soft: rgba(11,143,135,0.1);
    --text: #172126; --muted: #738188; --border: #e4eaed; --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .logo-area { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; }
  .logo-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; }
  .user-badge { background: #f0f2f5; padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  
  .banner-install { background: #0b8f87; color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 500; }
  .install-btn { background: #ffffff; color: #0b8f87; border: none; padding: 6px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  
  .hero-notice { background: #1677ff; color: white; margin: 20px 24px; padding: 24px; border-radius: var(--radius); text-align: center; font-size: 16px; font-weight: 600; }

  .store-card { background: var(--panel); margin: 20px 24px; padding: 24px; border-radius: var(--radius); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
  .store-title { font-size: 22px; font-weight: 800; }
  .store-sub { color: var(--muted); font-size: 14px; }
  
  /* Weavo Chat Button Styling */
  .weavo-chat-btn { background: linear-gradient(135deg, #0b8f87, #16b8a9); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; width: fit-content; box-shadow: 0 4px 14px rgba(11,143,135,0.25); transition: transform 0.2s; }
  .weavo-chat-btn:hover { transform: translateY(-2px); }

  .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin: 0 24px 30px; }
  .card-box { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .card-title { font-weight: 700; font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .search-input { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); background: #f8fafb; font-size: 14px; margin-bottom: 14px; }
  
  .offer-banner { background: linear-gradient(135deg, #f97316, #ea580c); color: white; border-radius: 12px; padding: 20px; text-align: center; font-weight: 700; height: 160px; display: flex; align-items: center; justify-content: center; }
  .local-deals-box { background: #22c55e; color: white; border-radius: 12px; padding: 20px; height: 160px; display: flex; align-items: center; justify-content: center; font-weight: 700; }

  @media (max-width: 768px) {
    .content-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo-area">
      <div class="logo-mark">AI</div>
      <div>
        <div>Nikhil Kirana</div>
        <div style="font-size: 11px; color: var(--muted); font-weight: 500;">अधिकृत ग्राहक स्टोअर</div>
      </div>
    </div>
    <div class="user-badge">
      <span>🟢</span> Abhinay Gandhi
    </div>
  </header>

  <div class="banner-install">
    <span>📱 Nikhil Kirana चे ॲप इन्स्टॉल करा</span>
    <button class="install-btn">इन्स्टॉल करा</button>
  </div>

  <div class="hero-notice">
    सध्या किराणा दुकानात सगळ्यात चांगलं ऑफर चालू आहे - प्रत्येक ₹१०० खरेदीवर सूट!
  </div>

  <div class="store-card">
    <div class="store-title">Nikhil Kirana</div>
    <div class="store-sub">📍 Satara</div>
    <div>
      <!-- Weavo Chat Button with Dynamic Bridge Link -->
      <button class="weavo-chat-btn" onclick="openWeavoChat()">
        💬 Weavo चॅट
      </button>
    </div>
  </div>

  <div class="content-grid">
    <div class="card-box">
      <div class="card-title"> किराणा व उत्पादने</div>
      <input class="search-input" placeholder="🔍 डाळ, साखर, तेल शोधಾ..." />
      <div style="text-align: center; padding: 20px;">
        <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=400&q=80" style="max-width: 100%; border-radius: 12px; max-height: 180px; object-fit: cover;" alt="Products" />
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px;">
      <div class="card-box">
        <div class="card-title">OFFERS</div>
        <div class="offer-banner">मेगा डिस्काउंट ऑफर चालू आहे!</div>
      </div>
      <div class="card-box">
        <div class="card-title">LOCAL DEALS</div>
        <div class="local-deals-box">स्थानिक ग्राहकांसाठी विशेष सवलत</div>
      </div>
    </div>
  </div>

<script>
  // AllERP ते Weavo डायनॅमिक चॅट ब्रिज फंक्शन
  function openWeavoChat() {
    // दुकानदाराचे युझरनेम (हे AllERP च्या डेटाबेसमдून डायनॅमिकली येईल)
    const storeUsername = "arham_gandhi"; 
    
    // ग्राहकाची माहिती (सध्या लॉग इन असलेल्या युझरकडून किंवा सिस्टीममधून)
    const customerEmail = "abhinay@example.com";
    const customerName = "Abhinay Gandhi";

    // Weavo ची सुरक्षित ब्रिज लिंक तयार करणे
    const weavoUrl = `https://arhammarketingme-prog.github.io/weavo/?store=${storeUsername}&customer_email=${encodeURIComponent(customerEmail)}&customer_name=${encodeURIComponent(customerName)}`;

    // नवीन टॅबमध्ये Weavo चॅट विंडो उघडणे
    window.open(weavoUrl, '_blank');
  }
</script>

</body>
</html>

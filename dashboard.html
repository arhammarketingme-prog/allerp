<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D4E89">
<title>ALL ERP — Universal Business Operating System</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
:root {
  --primary: #1D4E89; --success: #16a34a; --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --border-color: #cbd5e1;
}
body { background-color: var(--bg-color); color: var(--text-main); font-family: Roboto, sans-serif; margin: 0; padding: 0; }
.dashboard-main-frame { width: 98%; max-width: 1450px; margin: 10px auto; padding: 0 6px; }
.erp-header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 18px; border-radius: 8px; border: 1px solid var(--border-color); }
.erp-tab-pane { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="dashboard-main-frame">
  <div class="erp-header">
    <h1>ALL ERP Dashboard</h1>
  </div>
  <div id="tab-orders" class="erp-tab-pane">
    <h2>🛍️ ऑनलाईन ग्राहकांच्या ऑर्डर्स</h2>
    <div style="background:#fff; border:1px solid var(--border-color); border-radius:8px; padding:16px;">
      <table style="width:100%; border-collapse:collapse;">
        <thead>
          <tr style="text-align:left; border-bottom:2px solid var(--border-color);">
            <th>ऑर्डर #</th><th>ग्राहक नाव</th><th>संपर्क व पत्ता</th><th>तपशील</th><th>रक्कम</th><th>स्थिती</th>
          </tr>
        </thead>
        <tbody id="online-orders-table-body">
          <tr><td colspan="6" style="text-align:center; padding:20px;">ऑर्डर्स लोड होत आहेत...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
async function loadOnlineOrders() {
  if (typeof sb === 'undefined') return;
  var tbody = document.getElementById('online-orders-table-body');
  var orderRes = await sb.from('orders').select('*').order('created_at', { ascending: false });
  var orders = orderRes.data;
  if (orderRes.error || !orders || orders.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">कोणतीही ऑनलाईन ऑर्डर आलेली नाही.</td></tr>';
    return;
  }
  tbody.innerHTML = orders.map(function(o) {
    return '<tr style="border-bottom:1px solid #f1f5f9; padding:8px 0;">' +
      '<td><strong>#' + o.id.toString().substring(0,8) + '</strong></td>' +
      '<td>' + (o.customer_name || 'Customer') + '</td>' +
      '<td>📱 ' + (o.customer_phone || '-') + '<br><small>🏠 ' + (o.customer_address || 'पत्ता नाही') + '</small></td>' +
      '<td>' + (o.items_summary || '-') + '</td>' +
      '<td style="font-weight:bold; color:var(--success);">₹' + (o.total_amount || 0) + '</td>' +
      '<td><span>' + (o.status || 'pending') + '</span></td>' +
      '</tr>';
  }).join('');
}
loadOnlineOrders();
</script>
</body>
</html>

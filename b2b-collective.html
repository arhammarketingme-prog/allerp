<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2874f0">
<title>B2B Collective Buying Hub — ALL ERP</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.b2b-hero {
  background: linear-gradient(135deg, #0f172a, #1e3a8a);
  color: #fff;
  border-radius: 12px;
  padding: 32px 24px;
  margin-bottom: 20px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(15,23,42,0.15);
}
.b2b-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}
.b2b-card {
  background: #ffffff;
  border-radius: 12px;
  padding: 18px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  border: 1px solid #e2e8f0;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.b2b-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}
.pool-action-btn {
  width: 100%;
  border-radius: 8px;
  background: #2563eb;
  color: #fff;
  font-weight: 700;
  padding: 10px;
  border: none;
  cursor: pointer;
  transition: background 0.2s;
}
.pool-action-btn:hover {
  background: #1d4ed8;
}
</style>
</head>
<body>
<nav id="app-nav"></nav>

<main class="container page-ad-frame">
  <!-- 1. TOP AD SLOT -->
  <div id="ad-slot-b2b-top" class="ad-slot-banner"></div>

  <div class="center-with-side-ads">
    <!-- 2. LEFT SIDE AD SLOT -->
    <aside class="ad-side-column">
      <div class="ad-side-card">
        <div class="side-ad-title">Sponsored</div>
        <div id="ad-slot-b2b-left"></div>
      </div>
    </aside>

    <!-- CENTER CONTENT -->
    <div class="main-center-content">
      <div class="b2b-hero">
        <div style="font-size:12px; font-weight:800; letter-spacing:1px; color:#ffe500; margin-bottom:8px;">🤝 B2B DIRECT WHOLESALE NETWORK</div>
        <h1 style="margin:0 0 8px 0; font-size:26px;">सामूहिक खरेदी केंद्र (Group Buying Hub)</h1>
        <p style="margin:0 auto; max-width:600px; font-size:13.5px; color:#cbd5e1;">परिसरातील सर्व दुकानांची मागणी एकत्र करून थेट मिल आणि फॅक्टरीकडून १०% ते १५% कमी भावात माल मिळवा.</p>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
        <h3 style="margin:0; font-size:18px; color:#0f172a;">⚡ सद्यस्थितीत चालू असलेले खरेदी पूल (Active Pools)</h3>
      </div>

      <div id="pools-grid" class="b2b-grid">
        <p class="muted">लोड होत आहे...</p>
      </div>
    </div>

    <!-- 3. RIGHT SIDE AD SLOT -->
    <aside class="ad-side-column">
      <div class="ad-side-card">
        <div class="side-ad-title">Featured</div>
        <div id="ad-slot-b2b-right"></div>
      </div>
    </aside>
  </div>

  <!-- 4. BOTTOM AD SLOT -->
  <div id="ad-slot-b2b-bottom" class="ad-slot-banner" style="margin-top:20px"></div>
</main>

<div id="pool-modal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1000;">
  <div class="card" style="width:90%; max-width:440px; padding:24px; background:white; border-radius:12px;">
    <h3 id="pool-modal-title" style="margin-top:0; font-size:18px;">माझी मागणी नोंदवा</h3>
    <label style="font-weight:700; font-size:13px;">अपेक्षित प्रमाण (Quantity)</label>
    <input id="pool-qty" type="number" min="1" placeholder="उदा. 50" style="width:100%; padding:8px; margin-top:4px; margin-bottom:12px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

    <label style="font-weight:700; font-size:13px;">तुमचा फोन नंबर</label>
    <input id="pool-phone" placeholder="9822XXXXXX" style="width:100%; padding:8px; margin-top:4px; margin-bottom:12px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
    <p id="pool-modal-error" style="color:red; font-size:12.5px; margin:0 0 8px;"></p>

    <div style="display:flex; gap:10px;">
      <button id="pool-modal-submit" class="btn" style="flex:1; background:#16a34a; color:#fff; font-weight:700; padding:10px; border:none; border-radius:6px; cursor:pointer;">नोंदवा</button>
      <button class="btn secondary" style="flex:1; background:#e2e8f0; color:#334155; font-weight:700; padding:10px; border:none; border-radius:6px; cursor:pointer;" onclick="document.getElementById('pool-modal').style.display='none'">रद्द</button>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/cart.js"></script>
<script src="js/nav.js"></script>
<script src="js/ads.js"></script>
<script>
let currentUser = null;
let activePoolId = null;

async function initB2BPage() {
  try {
    const { data: { user } } = await sb.auth.getUser();
    currentUser = user;
  } catch (e) {}
  await loadPools();
}

async function loadPools() {
  const grid = document.getElementById('pools-grid');
  const { data, error } = await sb
    .from('group_buying_pools_public')
    .select('*')
    .eq('status', 'active')
    .order('created_at', { ascending: false });

  if (error) { grid.innerHTML = `<p style="color:red;">त्रुटी: ${error.message}</p>`; return; }
  if (!data || data.length === 0) {
    grid.innerHTML = '<p class="muted">सध्या कुठलाही सक्रिय खरेदी पूल नाही. लवकरच नवीन पूल सुरू होतील!</p>';
    return;
  }

  grid.innerHTML = data.map(p => {
    const pct = Math.min(100, Math.round((p.committed_quantity / p.target_quantity) * 100));
    return `
    <div class="b2b-card">
      <div>
        <span class="badge live" style="margin-bottom:8px;">LIVE POOL</span>
        <h3 style="margin:0 0 6px 0; font-size:17px;">${escapeHtmlB2B(p.item_name)}</h3>
        <p style="font-size:13px; color:#475569; margin:0 0 10px;">फॅक्टरी दर: ₹${p.factory_price}/${escapeHtmlB2B(p.unit_label)}${p.retail_price ? ` (किरकोळ बाजार: ₹${p.retail_price})` : ''}</p>
        <div style="background:#f1f5f9; border-radius:8px; padding:10px; margin-bottom:12px; font-size:13px;">
          <div>एकत्रित मागणी: <strong>${p.committed_quantity} ${escapeHtmlB2B(p.unit_label)} / ${p.target_quantity} ${escapeHtmlB2B(p.unit_label)}</strong></div>
          <div style="width:100%; height:8px; background:#e2e8f0; border-radius:4px; margin-top:6px; overflow:hidden;">
            <div style="width:${pct}%; height:100%; background:#16a34a;"></div>
          </div>
        </div>
      </div>
      <button class="pool-action-btn" onclick="openPoolModal('${p.id}', '${escapeHtmlB2B(p.item_name).replace(/'/g, "\\'")}')">माझी मागणी नोंदवा (+ Joint Order)</button>
    </div>`;
  }).join('');
}

function escapeHtmlB2B(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function openPoolModal(poolId, itemName) {
  if (!currentUser) {
    alert('कृपया आधी लॉगिन करा.');
    window.location.href = 'login.html';
    return;
  }
  activePoolId = poolId;
  document.getElementById('pool-modal-title').textContent = `'${itemName}' साठी मागणी नोंदवा`;
  document.getElementById('pool-qty').value = '';
  document.getElementById('pool-phone').value = '';
  document.getElementById('pool-modal-error').textContent = '';
  document.getElementById('pool-modal').style.display = 'flex';
}

document.getElementById('pool-modal-submit').addEventListener('click', async () => {
  const qty = Number(document.getElementById('pool-qty').value);
  const phone = document.getElementById('pool-phone').value.trim();
  const errorEl = document.getElementById('pool-modal-error');

  if (!qty || qty <= 0) { errorEl.textContent = 'कृपया योग्य प्रमाण टाका.'; return; }

  const { error } = await sb.rpc('commit_to_pool', { p_pool_id: activePoolId, p_quantity: qty, p_phone: phone || null });
  if (error) { errorEl.textContent = error.message; return; }

  alert('धन्यवाद! तुमची मागणी नोंदवली गेली आहे. ग्रुप पूर्ण होताच थेट फॅक्टरी इन्व्हॉइस तयार होईल.');
  document.getElementById('pool-modal').style.display = 'none';
  await loadPools();
});

// Render 4-side distinct sponsored ads
renderMultiAdSlots([
  { id: 'ad-slot-b2b-top', placement: 'top' },
  { id: 'ad-slot-b2b-left', placement: 'left' },
  { id: 'ad-slot-b2b-right', placement: 'right' },
  { id: 'ad-slot-b2b-bottom', placement: 'bottom' }
]);

initB2BPage();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllERP Store</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .btn { padding: 12px 24px; font-size: 16px; background-color: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 10px; }
        .btn-weavo { background-color: #059669; }
        .user-box { margin-top: 20px; padding: 15px; background-color: #f3f4f6; border-radius: 8px; }
    </style>
</head>
<body>

    <h2>AllERP Store</h2>
    
    <!-- लॉगिन नसताना दिसणारा विभाग -->
    <div id="authSection">
        <button id="loginBtn" class="btn" onclick="signInWithGoogle()">Google वरून लॉगिन करा</button>
    </div>

    <!-- लॉगिन झाल्यावर दिसणारा विभाग -->
    <div id="userSection" class="user-box" style="display: none;">
        <p>लॉगिन खाते: <strong id="userEmail"></strong></p>
        <button class="btn btn-weavo" onclick="openWeavoWithSSO()">Weavo उघडा (थेट प्रवेश)</button>
        <br>
        <button class="btn" style="background-color: #dc2626;" onclick="signOut()">लॉगआउट</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://flprhrbbllxfcdaornio.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // तुमची AllERP ची anon key इथे ठेवा
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function signInWithGoogle() {
            await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + window.location.pathname
                }
            });
        }

        async function signOut() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('userSection').style.display = 'block';
                document.getElementById('userEmail').innerText = session.user.email;
            }
        }

        // Weavo उघडताना लॉगिन झालेला ईमेल सुरक्षितपणे सोबत पाठवणे
        async function openWeavoWithSSO() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user && session.user.email) {
                const userEmail = encodeURIComponent(session.user.email);
                // Weavo ची लिंक आणि ईमेल
                window.location.href = `https://arhammarketingme-prog.github.io/weavo/#user_email=${userEmail}`;
            } else {
                alert('कृपया आधी AllERP मध्ये Google ने लॉगिन करा!');
            }
        }

        checkSession();
    </script>
</body>
</html>

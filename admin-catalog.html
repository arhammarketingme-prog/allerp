<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllERP - कॅटलॉग व्यवस्थापन व प्रॉडक्ट ॲड</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .catalog-container {
            max-width: 900px;
            margin: 25px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .search-row {
            display: flex;
            gap: 10px;
        }
        .btn-search {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn-search:hover {
            background: #0369a1;
        }
        .image-preview-container {
            margin-top: 12px;
            border: 2px dashed #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            background: #f8fafc;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .image-card {
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 6px;
            cursor: pointer;
            background: #fff;
            text-align: center;
            transition: all 0.2s ease;
        }
        .image-card:hover {
            border-color: #0284c7;
            transform: translateY(-2px);
        }
        .image-card.selected {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2);
            background: #f0fdf4;
        }
        .image-card img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            border-radius: 4px;
        }
        .image-card p {
            margin: 6px 0 0;
            font-size: 11px;
            color: #64748b;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-submit {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .btn-submit:hover {
            background: #15803d;
        }
        .selected-preview {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
        .selected-preview img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="catalog-container">
        <h2>नवीन प्रॉडक्ट जोडा (स्मार्ट ऑटो-इमेज शोध)</h2>
        <p style="color: #666; font-size: 14px;">फक्त ब्रँड किंवा प्रॉडक्टचे नाव टाका (उदा. <b>Nestle Maggi</b>, <b>Parle-G</b>), ओरिजिनल फोटो आपोआप लोड होतील.</p>
        <hr style="margin-bottom: 20px; border: 0; border-top: 1px solid #eee;">

        <form id="productForm" onsubmit="saveProduct(event)">
            <!-- १. प्रॉडक्टचे नाव व लाइव्ह सर्च -->
            <div class="form-group">
                <label for="productName">प्रॉडक्टचे नाव / ब्रँड</label>
                <div class="search-row">
                    <input type="text" id="productName" class="form-control" placeholder="उदा. Nestle Maggi 70g किंवा अमूल बटर..." required>
                    <button type="button" class="btn-search" onclick="fetchOriginalImages()">फोटो शोधा 🔍</button>
                </div>
            </div>

            <!-- २. बारकोड (पर्यायी) -->
            <div class="form-group">
                <label for="productBarcode">बारकोड (EAN / UPC - असल्यास)</label>
                <input type="text" id="productBarcode" class="form-control" placeholder="उदा. 8901058852399">
            </div>

            <!-- ३. ओरिजिनल इमेज पिकर विभाग -->
            <div class="form-group image-preview-container">
                <label>ओरिजिनल प्रॉडक्ट फोटो (खालीलपैकी एक निवडा)</label>
                <div id="searchStatus" style="font-size: 13px; color: #64748b; margin-top: 5px;">प्रॉडक्टचे नाव टाकून "फोटो शोधा" वर क्लिक करा.</div>
                
                <div id="imageGrid" class="image-grid"></div>

                <!-- निवडलेली मुख्य इमेज -->
                <div id="selectedDisplay" class="selected-preview" style="display: none;">
                    <img id="mainImagePreview" src="" alt="निवडलेला फोटो">
                    <div>
                        <b style="color: #16a34a;">✓ हा फोटो निवडला गेला आहे</b>
                        <input type="hidden" id="finalImageUrl" required>
                    </div>
                </div>
            </div>

            <!-- ४. किंमत आणि स्टॉक -->
            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label for="productMRP">एमआरपी (MRP ₹)</label>
                    <input type="number" id="productMRP" class="form-control" placeholder="14" step="0.5" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="productPrice">विक्री किंमत (Selling Price ₹)</label>
                    <input type="number" id="productPrice" class="form-control" placeholder="12" step="0.5" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="productStock">स्टॉक संख्या</label>
                    <input type="number" id="productStock" class="form-control" value="50" required>
                </div>
            </div>

            <!-- ५. सेव्ह करा -->
            <button type="submit" class="btn-submit">दुकानात प्रॉडक्ट ॲड करा</button>
        </form>
    </div>

    <!-- लॉजिक व API इंटिग्रेशन -->
    <script src="js/supabase-client.js"></script>
    <script>
        // १. Open Food Facts व मोफत स्त्रोतांवरून इमेज शोधणे
        async function fetchOriginalImages() {
            const query = document.getElementById('productName').value.trim();
            const barcode = document.getElementById('productBarcode').value.trim();
            const statusDiv = document.getElementById('searchStatus');
            const gridDiv = document.getElementById('imageGrid');

            if (!query && !barcode) {
                alert('कृपया प्रॉडक्टचे नाव किंवा बारकोड प्रविष्ट करा!');
                return;
            }

            statusDiv.innerHTML = 'ओरिजिनल फोटो शोधत आहे... कृपया थांबा...';
            gridDiv.innerHTML = '';

            let foundImages = [];

            // A. आधी बारकोड असेल तर थेट सर्च करणे
            if (barcode) {
                try {
                    const bRes = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
                    const bData = await bRes.json();
                    if (bData.status === 1 && bData.product) {
                        const p = bData.product;
                        if (p.image_front_url || p.image_url) {
                            foundImages.push({
                                url: p.image_front_url || p.image_url,
                                title: p.product_name || query
                            });
                        }
                    }
                } catch (e) {
                    console.warn("बारकोड शोध त्रुटी:", e);
                }
            }

            // B. नावाने ओपन फूड फॅक्ट्स सर्च करणे
            if (foundImages.length < 4 && query) {
                try {
                    const encodedQuery = encodeURIComponent(query);
                    const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodedQuery}&search_simple=1&action=process&json=1&page_size=6`);
                    const data = await res.json();

                    if (data.products && data.products.length > 0) {
                        data.products.forEach(item => {
                            const img = item.image_front_url || item.image_url;
                            if (img && !foundImages.some(x => x.url === img)) {
                                foundImages.push({
                                    url: img,
                                    title: item.product_name || query
                                });
                            }
                        });
                    }
                } catch (e) {
                    console.warn("ओपन फूड फॅक्ट्स शोध त्रुटी:", e);
                }
            }

            // C. बॅकअप पर्याय: विकिमीडिया कॉमन्स
            if (foundImages.length === 0 && query) {
                try {
                    const wikiRes = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=5&prop=imageinfo&iiprop=url&format=json&origin=*`);
                    const wikiData = await wikiRes.json();
                    if (wikiData.query && wikiData.query.pages) {
                        Object.values(wikiData.query.pages).forEach(page => {
                            if (page.imageinfo && page.imageinfo[0] && page.imageinfo[0].url) {
                                foundImages.push({
                                    url: page.imageinfo[0].url,
                                    title: page.title.replace('File:', '')
                                });
                            }
                        });
                    }
                } catch (e) {
                    console.warn("विकिमीडिया शोध त्रुटी:", e);
                }
            }

            // निकाल UI मध्ये दाखवणे
            if (foundImages.length > 0) {
                statusDiv.innerHTML = `<b>${foundImages.length}</b> ओरिजिनल फोटो सापडले. खालील योग्य फोटोवर क्लिक करा:`;
                foundImages.forEach((imgObj, idx) => {
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    card.innerHTML = `
                        <img src="${imgObj.url}" alt="${imgObj.title}" onerror="this.parentElement.style.display='none'">
                        <p title="${imgObj.title}">${imgObj.title}</p>
                    `;
                    card.onclick = () => selectProductImage(imgObj.url, card);
                    gridDiv.appendChild(card);

                    // पहिला फोटो आपोआप सिलेक्ट करा
                    if (idx === 0) {
                        selectProductImage(imgObj.url, card);
                    }
                });
            } else {
                statusDiv.innerHTML = '<span style="color: #dc2626;">कोणतीही थेट ओरिजिनल इमेज सापडली नाही. तुम्ही कस्टम इमेज URL टाकू शकता.</span>';
            }
        }

        // २. इमेज निवडणे
        function selectProductImage(url, element) {
            document.querySelectorAll('.image-card').forEach(el => el.classList.remove('selected'));
            if (element) element.classList.add('selected');

            document.getElementById('finalImageUrl').value = url;
            document.getElementById('mainImagePreview').src = url;
            document.getElementById('selectedDisplay').style.display = 'flex';
        }

        // ३. फॉर्म सेव्ह करणे (Supabase मध्ये सेव्ह)
        async function saveProduct(event) {
            event.preventDefault();

            const name = document.getElementById('productName').value;
            const barcode = document.getElementById('productBarcode').value;
            const imageUrl = document.getElementById('finalImageUrl').value;
            const mrp = parseFloat(document.getElementById('productMRP').value);
            const price = parseFloat(document.getElementById('productPrice').value);
            const stock = parseInt(document.getElementById('productStock').value);

            if (!imageUrl) {
                alert('कृपया आधी एक ओरिजिनल फोटो निवडा!');
                return;
            }

            try {
                // Supabase मध्ये प्रॉडक्ट सेव्ह करा (तुमच्या स्कीमानुसार)
                if (window.supabaseClient) {
                    const { data, error } = await window.supabaseClient
                        .from('products')
                        .insert([
                            {
                                title: name,
                                barcode: barcode || null,
                                image_url: imageUrl,
                                mrp: mrp,
                                price: price,
                                stock: stock
                            }
                        ]);

                    if (error) throw error;
                    alert('अभिनंदन! प्रॉडक्ट आणि ओरिजिनल फोटो यशस्वीरीत्या सेव्ह झाले!');
                    document.getElementById('productForm').reset();
                    document.getElementById('imageGrid').innerHTML = '';
                    document.getElementById('selectedDisplay').style.display = 'none';
                    document.getElementById('searchStatus').innerHTML = 'प्रॉडक्टचे नाव टाकून "फोटो शोधा" वर क्लिक करा.';
                } else {
                    alert(`प्रॉडक्ट तयार आहे:\nनाव: ${name}\nइमेज URL: ${imageUrl}\nकिंमत: ₹${price}`);
                }
            } catch (err) {
                console.error("सेव्ह करताना अडचण:", err);
                alert("त्रुटी: " + err.message);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALL ERP - Smart Marketplace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: #333; }
    header { background: #003366; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 22px; font-weight: bold; }
    .container { max-width: 1000px; margin: 30px auto; padding: 0 15px; }
    h2 { color: #003366; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .product-card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
    .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; background: #eee; }
    .product-card h3 { margin: 15px 0 10px; font-size: 18px; }
    .price { font-size: 20px; color: #28a745; font-weight: bold; margin-bottom: 15px; }
    .btn { display: block; width: 100%; padding: 10px; font-size: 15px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
    .btn-cart { background: #ff9900; color: white; }
    .btn-buy { background: #28a745; color: white; }
    .cart-badge { background: #ff4757; color: white; padding: 2px 8px; border-radius: 50%; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🚀 ALL ERP Smart Marketplace</div>
    <div>
      <a href="login.html" style="background: #ff4757; color: white; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-weight: bold;"><i class="fas fa-sign-in-alt"></i> लॉगिन / Login</a>
    </div>
  </header>

  <div class="container">
    <h2>🛍️ उपलब्ध उत्पादने (Available Products)</h2>
    
    <div class="products-grid">
      <!-- प्रॉडक्ट १: Lux Soap -->
      <div class="product-card">
        <div style="font-size: 40px; color: #888; margin: 30px 0;"><i class="fas fa-soap"></i></div>
        <h3>Lux Soap</h3>
        <div class="price">₹40</div>
        
        <!-- ॲड टू कार्ट बटण -->
        <button class="btn btn-cart" onclick="addToCart('prod-lux-1', 'Lux Soap', 40, 'b9ea82ab-e398-4ee7-a2c0-8e4052c9188a')">
          <i class="fas fa-cart-plus"></i> Add to Cart
        </button>

        <!-- थेट चेकआउट बटण (लॉगिन असेल तर पुढे जाईल, नसेल तर थेट लॉगिन पेजवर फेकेल) -->
        <button class="btn btn-buy" onclick="processDirectCheckout()">
          <i class="fas fa-bolt"></i> थेट ऑर्डर करा (Buy Now)
        </button>
      </div>

      <!-- प्रॉडक्ट २: Surf Excel -->
      <div class="product-card">
        <div style="font-size: 40px; color: #888; margin: 30px 0;"><i class="fas fa-box"></i></div>
        <h3>Surf Excel 1kg</h3>
        <div class="price">₹120</div>
        
        <button class="btn btn-cart" onclick="addToCart('prod-surf-2', 'Surf Excel 1kg', 120, 'b9ea82ab-e398-4ee7-a2c0-8e4052c9188a')">
          <i class="fas fa-cart-plus"></i> Add to Cart
        </button>

        <button class="btn btn-buy" onclick="processDirectCheckout()">
          <i class="fas fa-bolt"></i> थेट ऑर्डर करा (Buy Now)
        </button>
      </div>
    </div>
  </div>

  <!-- खात्रीशीर आणि एरर-फ्री कार्ट स्क्रिप्ट -->
  <script src="js/cart.js"></script>
</body>
</html>

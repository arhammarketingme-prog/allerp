<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product - Business Super Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: #333; }
    header { background: #003366; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 22px; font-weight: bold; }
    .container { max-width: 900px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .product-box { display: flex; gap: 30px; flex-wrap: wrap; }
    .product-img { flex: 1; min-width: 250px; background: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; height: 250px; font-size: 50px; color: #888; }
    .product-details { flex: 2; min-width: 250px; }
    h1 { margin-top: 0; color: #222; }
    .price { font-size: 24px; color: #28a745; font-weight: bold; margin: 15px 0; }
    .btn-group { display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap; }
    .btn { padding: 12px 25px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
    .btn-cart { background: #ff9900; color: white; }
    .btn-cart:hover { background: #e68a00; }
    .btn-buy { background: #28a745; color: white; }
    .btn-buy:hover { background: #218838; }
    .cart-badge { background: #ff4757; color: white; padding: 2px 8px; border-radius: 50%; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🚀 ALL ERP</div>
    <div>
      <a href="index.html" style="color: white; text-decoration: none; margin-right: 20px;"><i class="fas fa-home"></i> होम</a>
      <a href="cart.html" style="color: white; text-decoration: none;"><i class="fas fa-shopping-cart"></i> कार्ट <span id="bar-cart-count" class="cart-badge">0</span></a>
    </div>
  </header>

  <div class="container">
    <div class="product-box">
      <div class="product-img">
        <i class="fas fa-box-open"></i>
      </div>
      <div class="product-details">
        <h1 id="product-name-title">Lux Soap</h1>
        <p style="color: #666;">उत्कृष्ट गुणवत्तेचे अस्सल लोकल उत्पादन.</p>
        <div class="price">₹40 <span style="font-size: 14px; color: #999; text-decoration: line-through;">₹50</span></div>
        
        <div class="btn-group">
          <!-- 1. ॲड टू कार्ट बटण -->
          <button class="btn btn-cart" onclick="addToCart('prod-lux-1', 'Lux Soap', 40, 'b9ea82ab-e398-4ee7-a2c0-8e4052c9188a')">
            <i class="fas fa-cart-plus"></i> Add to Cart
          </button>

          <!-- 2. थेट स्वतंत्र चेकआउट/ऑर्डर बटण (लॉगिन मेकॅनिझमसह) -->
          <button class="btn btn-buy" onclick="processDirectCheckout()">
            <i class="fas fa-bolt"></i> थेट ऑर्डर करा (Buy Now)
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- सेक्युरिफाइड आणि एरर-फ्री कार्ट स्क्रिप्ट लिंक -->
  <script src="js/cart.js"></script>
  <script>
    // URL मधील प्रॉडक्टचे नाव डायनॅमिकली सेट करणे
    const urlParams = new URLSearchParams(window.location.search);
    const prodName = urlParams.get('name');
    if (prodName) {
      document.getElementById('product-name-title').innerText = decodeURIComponent(prodName);
    }
  </script>
</body>
</html>
